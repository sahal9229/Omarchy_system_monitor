<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222a"/>
      <stop offset="100%" stop-color="#13161c"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#333b4d" stroke-width="2.5"/>

  <!-- Subtle Chart Grid Lines -->
  <line x1="20" y1="44" x2="108" y2="44" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="20" y1="68" x2="108" y2="68" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="20" y1="92" x2="108" y2="92" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="44" y1="30" x2="44" y2="98" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="84" y1="30" x2="84" y2="98" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3,3" stroke-width="1.2"/>

  <!-- Filled Area Under Pulse Wave -->
  <path d="M 22 84 L 38 84 L 48 54 L 60 92 L 72 38 L 84 76 L 94 66 L 106 66 L 106 98 L 22 98 Z" fill="url(#areaGrad)"/>

  <!-- Glowing Line Curve -->
  <path d="M 22 84 L 38 84 L 48 54 L 60 92 L 72 38 L 84 76 L 94 66 L 106 66" fill="none" stroke="url(#pulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Peak Indicator Node -->
  <circle cx="72" cy="38" r="4.5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
</svg>
